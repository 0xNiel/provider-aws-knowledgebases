apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
---
apiVersion: v1
kind: Secret
metadata:
  namespace: crossplane-system
  name: aws-creds
type: Opaque
data:
  # AWS credentials in INI format (base64 encoded)
  # [default]
  # aws_access_key_id = AKIAIOSFODNN7EXAMPLE
  # aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  credentials: W2RlZmF1bHRdCmF3c19hY2Nlc3Nfa2V5X2lkID0gQUtJQUlPU0ZPRE5ON0VYQU1QTEUKYXdzX3NlY3JldF9hY2Nlc3Nfa2V5ID0gd0phbHJYVXRuRkVNSS9LN01ERU5HL2JQeFJmaUNZRVhBTVBMRUtFWQo=
---
apiVersion: providerawsknowledgebases.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    meta.crossplane.io/example: "true"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
