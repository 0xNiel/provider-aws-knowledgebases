apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
---
apiVersion: v1
kind: Secret
metadata:
  namespace: crossplane-system
  name: aws-role-creds
type: Opaque
data:
  # AWS credentials in INI format (base64 encoded) with role assumption
  # [default]
  # aws_access_key_id = AKIAIOSFODNN7EXAMPLE
  # aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  # role_arn = arn:aws:iam::123456789012:role/CrossplaneProviderAWSKnowledgeBasesRole
  # role_session_name = crossplane-provider-session
  credentials: 
---
apiVersion: providerawsknowledgebases.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: role-assumption
  annotations:
    meta.crossplane.io/example: "true"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-role-creds
      key: credentials
